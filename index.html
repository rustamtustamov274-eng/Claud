<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Web Architect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e1e2e; }
    ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  </style>
</head>
<body class="h-screen overflow-hidden bg-[#131314] font-sans text-gray-100 flex flex-col">

  <header class="h-14 shrink-0 border-b border-gray-800 bg-[#1e1f20] px-4 md:px-6 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-8 h-8 shrink-0 rounded-lg bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center font-bold text-black">AI</div>
      <h1 class="hidden sm:block font-semibold tracking-wide">
        AI Web Architect <span class="ml-1 rounded-full bg-orange-500/20 px-2 py-0.5 text-xs text-orange-400">Pro</span>
      </h1>
    </div>

    <div class="flex items-center justify-end gap-2">
      <select id="modelSelect" aria-label="AI model"
        class="max-w-40 md:max-w-none rounded-lg border border-gray-700 bg-[#131314] px-2 py-1.5 text-xs md:text-sm focus:outline-none focus:border-orange-500">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      </select>
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Gemini API kaliti"
        class="w-32 md:w-56 rounded-lg border border-gray-700 bg-[#131314] px-3 py-1.5 text-xs md:text-sm focus:outline-none focus:border-orange-500">
      <button id="downloadBtn" title="HTML faylni yuklab olish"
        class="rounded-lg bg-gray-800 px-3 py-1.5 text-xs md:text-sm hover:bg-gray-700">
        <i class="fa-solid fa-download"></i><span class="hidden md:inline"> Yuklab olish</span>
      </button>
    </div>
  </header>

  <main class="flex flex-1 overflow-hidden">
    <aside class="flex w-[38%] min-w-[290px] max-w-[500px] flex-col border-r border-gray-800 bg-[#18191a]">
      <div class="flex items-center justify-between border-b border-gray-800/70 px-4 py-2 text-xs text-gray-400">
        <span>Suhbat</span>
        <button id="resetBtn" class="transition hover:text-orange-400" title="Yangi loyiha">
          <i class="fa-solid fa-rotate-right mr-1"></i> Yangi sayt
        </button>
      </div>

      <div id="chatBox" aria-live="polite" class="flex-1 space-y-4 overflow-y-auto p-4">
        <div class="rounded-2xl rounded-tl-none bg-[#242526] p-3.5 text-sm leading-relaxed text-gray-300">
          Salom! Qanday sayt yaratmoqchisiz? Tayyor saytni keyingi buyruqlar bilan tahrirlashingiz ham mumkin.
        </div>
      </div>

      <form id="promptForm" class="border-t border-gray-800 bg-[#1e1f20] p-4">
        <div class="relative">
          <textarea id="promptInput" rows="3" placeholder="Sayt g‘oyasini yozing... (Enter — yuborish)"
            class="w-full resize-none rounded-xl border border-gray-700 bg-[#131314] p-3 pr-12 text-sm focus:outline-none focus:border-orange-500"></textarea>
          <button id="sendBtn" type="submit" aria-label="Yuborish"
            class="absolute bottom-3 right-3 flex h-8 w-8 items-center justify-center rounded-lg bg-orange-500 text-black transition hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-50">
            <i id="sendIcon" class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </form>
    </aside>

    <section class="flex min-w-0 flex-1 flex-col bg-[#0e0e10]">
      <div class="flex h-11 shrink-0 items-center justify-between border-b border-gray-800 bg-[#18191a] px-3 md:px-4">
        <div class="flex gap-2">
          <button id="tabPreview" class="rounded-md bg-orange-500/20 px-3 py-1 text-xs font-medium text-orange-400">
            <i class="fa-solid fa-eye mr-1"></i> Ko‘rinish
          </button>
          <button id="tabCode" class="rounded-md px-3 py-1 text-xs font-medium text-gray-400 hover:text-white">
            <i class="fa-solid fa-code mr-1"></i> Kod
          </button>
        </div>

        <div class="flex items-center gap-2">
          <div id="viewportControls" class="hidden sm:flex items-center gap-1 rounded-lg border border-gray-800 bg-[#131314] p-1">
            <button data-width="100%" title="Kompyuter" class="px-2 text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-desktop"></i></button>
            <button data-width="768px" title="Planshet" class="px-2 text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button data-width="375px" title="Telefon" class="px-2 text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-mobile-screen-button"></i></button>
          </div>
          <button id="copyBtn" class="hidden text-xs text-gray-400 hover:text-orange-400">
            <i class="fa-regular fa-copy mr-1"></i> Nusxalash
          </button>
          <span id="statusText" class="text-xs text-gray-400">Tayyor</span>
        </div>
      </div>

      <div id="previewContainer" class="flex flex-1 justify-center overflow-auto bg-[#1a1a1d]">
        <iframe id="previewFrame" title="Yaratilgan sayt ko‘rinishi"
          sandbox="allow-scripts allow-forms allow-modals"
          class="h-full w-full border-0 bg-white transition-all duration-300"></iframe>
      </div>
      <div id="codeContainer" class="hidden flex-1 overflow-auto bg-[#131314] p-4">
        <pre class="whitespace-pre-wrap break-words"><code id="codeOutput" class="font-mono text-xs text-green-400"></code></pre>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const apiKeyInput = $("apiKeyInput");
    const promptInput = $("promptInput");
    const chatBox = $("chatBox");
    const statusText = $("statusText");
    const sendBtn = $("sendBtn");
    const sendIcon = $("sendIcon");
    let currentGeneratedCode = "";
    let isGenerating = false;

    const SYSTEM_PROMPT = `Sen tajribali frontend dasturchi va UI/UX dizaynersan.
Foydalanuvchi so‘ragan saytni yagona, to‘liq HTML fayl qilib yarat yoki berilgan HTML kodni yangila.
Talablar:
- Tailwind CSS CDN ishlat.
- Zamonaviy, moslashuvchan va mobil qurilmalarga mos dizayn yarat.
- Kerak bo‘lsa animatsiya, ikonka va rasmlardan foydalan.
- Tushuntirish yozma; faqat to‘liq HTML kodni qaytar va uni \`\`\`html ... \`\`\` ichiga ol.`;

    function appendMessage(text, type) {
      const message = document.createElement("div");
      message.className = type === "user"
        ? "ml-8 rounded-2xl rounded-tr-none border border-orange-500/30 bg-orange-500/10 p-3.5 text-sm text-gray-200 whitespace-pre-wrap"
        : type === "success"
          ? "rounded-2xl rounded-tl-none bg-[#242526] p-3.5 text-sm text-green-400"
          : "rounded-2xl border border-red-500/30 bg-red-500/20 p-3.5 text-sm text-red-400";
      message.textContent = text;
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function extractHtmlCode(text) {
      const match = text.match(/```(?:html)?\s*([\s\S]*?)```/i);
      return (match?.[1] || text).trim();
    }

    $("promptForm").addEventListener("submit", (event) => {
      event.preventDefault();
      generateWebsite();
    });

    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        $("promptForm").requestSubmit();
      }
    });

    async function generateWebsite() {
      if (isGenerating) return;

      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();
      if (!apiKey) {
        alert("Avval Gemini API kalitini kiriting.");
        apiKeyInput.focus();
        return;
      }
      if (!prompt) return;

      appendMessage(prompt, "user");
      promptInput.value = "";
      isGenerating = true;
      sendBtn.disabled = true;
      sendIcon.className = "fa-solid fa-spinner fa-spin";
      statusText.textContent = "Sayt yaratilmoqda...";

      const userText = currentGeneratedCode
        ? `Joriy HTML kod:\n\`\`\`html\n${currentGeneratedCode}\n\`\`\`\n\nUni quyidagi talab asosida yangila va to‘liq HTML qaytar:\n${prompt}`
        : `Foydalanuvchi talabi: ${prompt}`;

      try {
        const model = $("modelSelect").value;
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: [{ role: "user", parts: [{ text: userText }] }]
            })
          }
        );

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP xatolik: ${response.status}`);
        }

        const rawText = data.candidates?.[0]?.content?.parts
          ?.map((part) => part.text || "")
          .join("");
        if (!rawText) throw new Error("Model bo‘sh javob qaytardi.");

        currentGeneratedCode = extractHtmlCode(rawText);
        $("previewFrame").srcdoc = currentGeneratedCode;
        $("codeOutput").textContent = currentGeneratedCode;
        appendMessage("✅ Sayt tayyor! Natijani o‘ng tomonda ko‘rishingiz mumkin.", "success");
        statusText.textContent = "Tayyor";
      } catch (error) {
        console.error(error);
        statusText.textContent = "Xatolik";
        appendMessage(`Xatolik: ${error.message}`, "error");
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        sendIcon.className = "fa-solid fa-arrow-up";
      }
    }

    function switchTab(tab) {
      const preview = tab === "preview";
      $("previewContainer").classList.toggle("hidden", !preview);
      $("codeContainer").classList.toggle("hidden", preview);
      $("viewportControls").classList.toggle("hidden", !preview);
      $("copyBtn").classList.toggle("hidden", preview);

      $("tabPreview").className = preview
        ? "rounded-md bg-orange-500/20 px-3 py-1 text-xs font-medium text-orange-400"
        : "rounded-md px-3 py-1 text-xs font-medium text-gray-400 hover:text-white";
      $("tabCode").className = !preview
        ? "rounded-md bg-orange-500/20 px-3 py-1 text-xs font-medium text-orange-400"
        : "rounded-md px-3 py-1 text-xs font-medium text-gray-400 hover:text-white";
    }

    $("tabPreview").addEventListener("click", () => switchTab("preview"));
    $("tabCode").addEventListener("click", () => switchTab("code"));

    document.querySelectorAll("[data-width]").forEach((button) => {
      button.addEventListener("click", () => {
        $("previewFrame").style.width = button.dataset.width;
      });
    });

    $("copyBtn").addEventListener("click", async () => {
      if (!currentGeneratedCode) return alert("Hali kod yaratilmagan.");
      try {
        await navigator.clipboard.writeText(currentGeneratedCode);
        $("copyBtn").innerHTML = '<i class="fa-solid fa-check mr-1 text-green-400"></i> Nusxalandi';
        setTimeout(() => {
          $("copyBtn").innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Nusxalash';
        }, 2000);
      } catch {
        alert("Nusxalash amalga oshmadi. Kod oynasidan qo‘lda nusxalang.");
      }
    });

    $("downloadBtn").addEventListener("click", () => {
      if (!currentGeneratedCode) return alert("Hali kod yaratilmagan.");
      const blob = new Blob([currentGeneratedCode], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "yangi-sayt.html";
      link.click();
      URL.revokeObjectURL(url);
    });

    $("resetBtn").addEventListener("click", () => {
      currentGeneratedCode = "";
      $("previewFrame").srcdoc = "";
      $("codeOutput").textContent = "";
      chatBox.replaceChildren();
      appendMessage("Yangi loyiha boshlandi. Qanday sayt yaratmoqchisiz?", "success");
      statusText.textContent = "Tayyor";
    });
  </script>
</body>
</html>
